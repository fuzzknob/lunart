<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pastebin</title>
        <style>
            body {
                margin: 0;
            }

            textarea {
                width: 100vw;
                height: 100vh;
                border: none;
                resize: none;
                font-family: sans-serif;
                font-size: 18px;
                outline: none;
                padding: 20px;
                margin: 0;
            }

            @media (prefers-color-scheme: dark) {
                textarea {
                    background-color: #2b2a33;
                    color: #fff;
                }

                textarea::placeholder {
                    color: #e8e8e8;
                }
            }
        </style>
    </head>
    <body>
        <textarea
            autofocus
            name="paste"
            id="text"
            placeholder="Paste Bin"
            spellcheck="false"
        ></textarea>

        <script>
            const socket = new WebSocket("ws://10.10.1.11:8000/ws");
            const text = document.getElementById("text");

            const id = crypto.getRandomValues(new Uint32Array(1))[0];

            socket.addEventListener("message", (event) => {
                const { data } = event;
                const msg = JSON.parse(data);

                if (id !== msg.id) {
                    text.value = msg.content;
                }
            });

            text.addEventListener("input", () => {
                socket.send(
                    JSON.stringify({
                        id,
                        content: text.value,
                    }),
                );
            });
        </script>
    </body>
</html>
