<!doctype html>
<html>
    <head>
        <title>Lunart Static Example</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="main">
            <h1 class="heading">
                This html file is statically served by
                <span id="lunart" class="lunart">Lunart</span> servers
            </h1>
            <section id="popup" class="popup">
                <div>
                    <div>
                        <img src="./imgs/lunar.jpg" alt="Lunar" />
                    </div>
                    <span>+</span>
                    <div>
                        <img src="./imgs/dart.jpg" alt="Dart" />
                    </div>
                </div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
